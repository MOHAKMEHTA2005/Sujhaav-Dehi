<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce + API</title>
    <style>
        body {
            background-color:rgb(198, 231, 250);
            color: #333;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 50px;
        }
        .home-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-right: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .home-button:hover {
            background-color: #45a049;
        }

        .search-bar {
            margin-top: 20px;
        }

        .product {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin: 10px auto;
            width: 60%;
            text-align: left;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }


        input{
            padding: 10px;
            font-size: 16px;
        }

        button{
            color: green;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        div.product{
            border: 1px solid black;
            border-radius: 10px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Recommendation System</h1>
    <h1>Search Here &#128071</h1>
    <form method="post" action="/" style="display: inline;">
        <a href="/" style="text-decoration: none; margin-right: 10px;">
            <button type="button" class="home-button">Home</button>

        </a>
        <input type="text" name="input" class="search-bar" placeholder="Enter Product Name" required>

        <button type="submit">Search</button>
    </form>

    <div>

        {% if results %}
            {% for product in results %}
                <div class="product">
                    <h2>{{ product.Title }}</h2>
                    <p>Rating: {{ product.Rating }}</p>
                    <p>Price: ₹{{ product['Price after Discount'] }}</p>
                    <p>MRP: ₹<s>{{ product.MRP }}</s></p>
                    <p>Delivery By: {{ product['Delivery By'] }}</p>
                </div>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
